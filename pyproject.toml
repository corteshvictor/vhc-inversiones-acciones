[tool.pytest.ini_options]
pythonpath = [".", "scripts", "tools"]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=scripts --cov=tools --cov-branch --cov-report=term-missing"

[tool.pyright]
extraPaths = ["scripts", "tools"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.coverage.run]
branch = true
source = ["scripts", "tools"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
